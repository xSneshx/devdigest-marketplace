name: site

on:
  push:
    branches: ['**']
    tags: ['*--v*']
    paths:
      - 'site/**'
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'docs/release-evidence/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'docs/release-evidence/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install (lockfile only)
        run: npm ci

      - name: Generate index
        run: npm run index
        env:
          SITE_REPOSITORY: ${{ github.repository }}
          SITE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle size budget
        run: npm run size

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          if-no-files-found: error

      - name: pages-gate
        id: gate
        env:
          PAGES_SWITCH: ${{ vars.SITE_PAGES_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          reason=""
          if [ "$PAGES_SWITCH" != "true" ]; then
            reason="repository variable SITE_PAGES_ENABLED is not 'true' (maintainer switch is off)"
          elif [ "$EVENT_NAME" != "push" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            reason="event '$EVENT_NAME' is not a push or a manual run"
          elif [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            reason="ref '$REF' is not the default branch '$DEFAULT_BRANCH'"
          fi
          if [ -n "$reason" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages deploy skipped::$reason"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages artifact
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
